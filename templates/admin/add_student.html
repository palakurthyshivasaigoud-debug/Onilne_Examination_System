{% extends 'admin/base_admin.html' %}
{% block title %}Add Student{% endblock %}
{% block page_title %}Add Student{% endblock %}

{% block content %}
<div class="form-card">
    <form method="POST" class="admin-form">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Student's full name" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="student@example.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required
                minlength="6">
        </div>
        <div class="form-actions">
            <a href="{{ url_for('admin.students') }}" class="btn-secondary">← Cancel</a>
            <button type="submit" class="btn-primary">Create Student</button>
        </div>
    </form>
</div>
{% endblock %}
